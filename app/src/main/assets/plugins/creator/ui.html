<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator</title>
</head>
<body>
<!--
  The panel's own styles come after the app's, so they win where they overlap.
  Every colour here is one of the app's: this is a tab, and a tab that looked
  like somebody else's app would be a worse tab.
-->
<style>
  body { padding: 0 0 96px; }
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: #0B0F14; border-bottom: 1px solid #223041;
    padding: 10px 14px 8px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .name {
    font: inherit; font-weight: 600; padding: 8px 10px; border-radius: 10px;
    border: 1px solid #223041; background: #10161F; color: #F1F5FA; width: 100%;
  }
  .muted { color: #8FA0B4; font-size: 12px; }
  .chip {
    display: inline-block; padding: 6px 12px; border-radius: 20px;
    border: 1px solid #223041; background: #121A24; color: #9BA9BB;
    font-size: 13px; white-space: nowrap;
  }
  .chip.on { background: #16324D; border-color: #2E7DD1; color: #DCE3EC; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
  .chips::-webkit-scrollbar { height: 0; }

  button.small {
    padding: 7px 11px; font-size: 13px; border-radius: 10px;
    background: #121A24; border: 1px solid #223041; color: #DCE3EC;
  }
  button.small.primary { background: #16324D; border-color: #2E7DD1; }
  button.small:disabled { opacity: .45; }

  .pane { padding: 12px 14px 0; }
  .head {
    display: flex; align-items: baseline; gap: 8px;
    margin: 14px 0 6px; color: #F1F5FA; font-weight: 600;
  }
  .head .muted { font-weight: 400; }

  /* -- the script ---------------------------------------------------- */
  .stack { padding-left: 0; }
  .stack .stack { padding-left: 14px; border-left: 1px dashed #223041; margin-left: 8px; }
  .blk {
    border: 1px solid #223041; border-left: 3px solid #2E7DD1;
    background: #121A24; border-radius: 10px;
    padding: 8px 10px; margin: 6px 0;
  }
  .blk.sel { border-color: #2E7DD1; background: #16243A; }
  .blk .lbl { font-size: 14px; color: #DCE3EC; }
  .blk .vals { font-size: 12px; color: #8FA0B4; margin-top: 3px; word-break: break-word; }
  .blk.cat-Logic, .blk.cat-Loops { border-left-color: #E0A33E; }
  .blk.cat-Functions, .blk.cat-Classes { border-left-color: #9B6FE0; }
  .blk.cat-Text, .blk.cat-Lists, .blk.cat-Dictionaries { border-left-color: #43B581; }
  .blk.cat-Errors { border-left-color: #E05A5A; }

  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tools button { padding: 6px 10px; font-size: 13px; min-width: 38px; }

  /* -- the palette --------------------------------------------------- */
  .pal { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pick {
    display: block; width: 100%; text-align: left;
    border: 1px solid #223041; background: #10161F; color: #DCE3EC;
    border-radius: 10px; padding: 9px 11px; margin: 5px 0; font: inherit;
  }
  .pick .code { display: block; color: #6FB3FF; font-size: 12px;
                font-family: ui-monospace, Menlo, Consolas, monospace; margin-top: 2px; }

  /* -- overlays ------------------------------------------------------ */
  .sheet {
    position: fixed; inset: 0; background: rgba(4, 8, 12, .82);
    display: none; z-index: 20; overflow-y: auto; padding: 24px 12px 40px;
  }
  .sheet.open { display: block; }
  .sheet .card { max-width: 640px; margin: 0 auto; }
  .field { margin: 10px 0; }
  .field label { display: block; font-size: 12px; color: #8FA0B4; margin-bottom: 4px; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #0B0F14; border-top: 1px solid #223041;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px;
  }
  .foot button { flex: 1 1 0; padding: 12px 8px; }
  .empty { color: #8FA0B4; font-size: 13px; padding: 18px 2px; }
  pre.out { max-height: 52vh; overflow: auto; }
</style>

<div class="bar">
  <div class="row">
    <input id="name" class="name grow" value="hello" aria-label="Project name">
    <button class="small" id="drawer">Projects</button>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="chips grow" id="langs"></div>
  </div>
  <div class="muted" id="count" style="margin-top:6px">&nbsp;</div>
</div>

<div class="pane">
  <div class="head">Your script <span class="muted" id="hint"></span></div>
  <div id="script"></div>

  <div class="head">Blocks <span class="muted" id="palcount"></span></div>
  <input id="search" class="name" placeholder="Search blocks" aria-label="Search blocks">
  <div class="chips" id="cats" style="margin-top:8px"></div>
  <div class="pal" id="palette"></div>
</div>

<div class="foot">
  <button class="small" id="new">New</button>
  <button class="small" id="build">Build</button>
  <button class="small primary" id="save">Save to Files</button>
</div>

<div class="sheet" id="editSheet">
  <div class="card">
    <h2 id="editTitle">Fill it in</h2>
    <div id="editFields"></div>
    <div class="row" style="margin-top:14px">
      <button class="small primary grow" id="editOk">Done</button>
      <button class="small" id="editCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet" id="codeSheet">
  <div class="card">
    <h2 id="codeTitle">What it writes</h2>
    <pre class="out"><code id="codeOut"></code></pre>
    <div id="codeProblems" class="muted"></div>
    <div class="row" style="margin-top:14px">
      <button class="small primary grow" id="codeSave">Save to Files</button>
      <button class="small" id="codeClose">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="saveSheet">
  <div class="card">
    <h2>Save into the workspace</h2>
    <div class="field">
      <label for="saveName">File name</label>
      <input id="saveName" class="name">
    </div>
    <div class="field">
      <label for="saveFolder">Folder inside the workspace (blank means the top)</label>
      <input id="saveFolder" class="name" placeholder="sites/blog">
    </div>
    <div class="row" style="margin-top:14px">
      <button class="small primary grow" id="saveOk">Save</button>
      <button class="small" id="saveCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="sheet" id="drawerSheet">
  <div class="card">
    <h2>Projects</h2>
    <div id="drawerList"></div>
    <div class="row" style="margin-top:14px">
      <button class="small grow" id="drawerClose">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- state
  //
  // A project is a language, a name and a tree of nodes; a node is a block id,
  // the values filled into its slots, and its children. Nothing else is kept:
  // the panel is a view of that tree, and every button below edits it and
  // redraws.

  var state = {
    id: '',                  // the project's id in the drawer, '' until saved
    project: { name: 'hello', language: 'python', blocks: [] },
    catalogue: null,         // categories for the current language
    byId: {},                // block id -> definition
    languages: [],
    category: '',
    search: '',
    selected: null           // a path, e.g. [0, 2, 1]
  };

  var $ = function (id) { return document.getElementById(id); };

  function escapeHtml(text) {
    return String(text === undefined || text === null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ------------------------------------------------------------ the tree
  //
  // Paths are arrays of indices. Everything that edits the script goes
  // through these five, so there is one place where the shape can go wrong.

  function listAt(path) {
    var list = state.project.blocks;
    for (var i = 0; i < path.length - 1; i++) {
      var node = list[path[i]];
      if (!node) return null;
      node.children = node.children || [];
      list = node.children;
    }
    return list;
  }

  function nodeAt(path) {
    if (!path) return null;
    var list = listAt(path);
    return list ? list[path[path.length - 1]] : null;
  }

  function samePath(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }

  function insertAfter(path, node) {
    if (!path) {
      state.project.blocks.push(node);
      return [state.project.blocks.length - 1];
    }
    var list = listAt(path);
    var at = path[path.length - 1] + 1;
    list.splice(at, 0, node);
    var next = path.slice();
    next[next.length - 1] = at;
    return next;
  }

  function removeAt(path) {
    var list = listAt(path);
    if (!list) return;
    list.splice(path[path.length - 1], 1);
  }

  function move(path, delta) {
    var list = listAt(path);
    var from = path[path.length - 1];
    var to = from + delta;
    if (to < 0 || to >= list.length) return path;
    var node = list.splice(from, 1)[0];
    list.splice(to, 0, node);
    var next = path.slice();
    next[next.length - 1] = to;
    return next;
  }

  // Into the block above it, if that block can hold things.
  function indent(path) {
    var list = listAt(path);
    var at = path[path.length - 1];
    if (at === 0) return path;
    var above = list[at - 1];
    var spec = state.byId[above.block];
    if (!spec || !spec.wrap) {
      pycmd.toast('The block above cannot hold blocks.');
      return path;
    }
    above.children = above.children || [];
    var node = list.splice(at, 1)[0];
    above.children.push(node);
    return path.slice(0, -1).concat([at - 1, above.children.length - 1]);
  }

  // Out to the parent's level, straight after the parent.
  function outdent(path) {
    if (path.length < 2) return path;
    var list = listAt(path);
    var node = list.splice(path[path.length - 1], 1)[0];
    var parentPath = path.slice(0, -1);
    var parentList = listAt(parentPath);
    var at = parentPath[parentPath.length - 1] + 1;
    parentList.splice(at, 0, node);
    var next = parentPath.slice();
    next[next.length - 1] = at;
    return next;
  }

  function countBlocks(nodes) {
    var total = 0;
    (nodes || []).forEach(function (node) {
      total += 1 + countBlocks(node.children);
    });
    return total;
  }

  // -------------------------------------------------------------- drawing

  function defaultsFor(spec) {
    var values = {};
    (spec.slots || []).forEach(function (slot) { values[slot.name] = slot.default; });
    return values;
  }

  function summarise(node, spec) {
    var parts = [];
    (spec.slots || []).forEach(function (slot) {
      var value = node.values && node.values[slot.name] !== undefined
        ? node.values[slot.name] : slot.default;
      if (String(value).length) parts.push(String(value));
    });
    return parts.join('  ·  ');
  }

  function drawScript() {
    var host = $('script');
    host.innerHTML = '';
    if (!state.project.blocks.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing here yet. Pick a block below and it lands here.';
      host.appendChild(empty);
    } else {
      host.appendChild(drawStack(state.project.blocks, []));
    }
    var total = countBlocks(state.project.blocks);
    $('count').textContent = total + ' block' + (total === 1 ? '' : 's') +
      '  ·  ' + state.project.language;
    $('hint').textContent = state.selected ? 'new blocks land under the selected one' : '';
  }

  function drawStack(nodes, base) {
    var wrap = document.createElement('div');
    wrap.className = 'stack';
    nodes.forEach(function (node, index) {
      var path = base.concat([index]);
      var spec = state.byId[node.block];
      var element = document.createElement('div');
      element.className = 'blk' + (samePath(path, state.selected) ? ' sel' : '');
      if (spec) element.className += ' cat-' + String(spec.cat).replace(/[^A-Za-z]/g, '');

      var label = document.createElement('div');
      label.className = 'lbl';
      label.textContent = spec ? spec.label : ('unknown block: ' + node.block);
      element.appendChild(label);

      if (spec && spec.slots.length) {
        var values = document.createElement('div');
        values.className = 'vals';
        values.textContent = summarise(node, spec);
        element.appendChild(values);
      }

      element.addEventListener('click', function (event) {
        event.stopPropagation();
        state.selected = samePath(path, state.selected) ? null : path;
        drawScript();
      });

      if (samePath(path, state.selected)) element.appendChild(drawTools(path, spec));
      wrap.appendChild(element);

      if (spec && spec.wrap) {
        node.children = node.children || [];
        if (node.children.length) wrap.appendChild(drawStack(node.children, path));
      }
    });
    return wrap;
  }

  function tool(label, title, action) {
    var button = document.createElement('button');
    button.className = 'small';
    button.textContent = label;
    button.title = title;
    button.setAttribute('aria-label', title);
    button.addEventListener('click', function (event) {
      event.stopPropagation();
      action();
    });
    return button;
  }

  function drawTools(path, spec) {
    var row = document.createElement('div');
    row.className = 'tools';
    row.appendChild(tool('▲', 'Move up', function () {
      state.selected = move(path, -1); drawScript();
    }));
    row.appendChild(tool('▼', 'Move down', function () {
      state.selected = move(path, 1); drawScript();
    }));
    row.appendChild(tool('→', 'Put inside the block above', function () {
      state.selected = indent(path); drawScript();
    }));
    row.appendChild(tool('←', 'Take back out', function () {
      state.selected = outdent(path); drawScript();
    }));
    if (spec && spec.slots.length) {
      row.appendChild(tool('Edit', 'Fill it in', function () { openEditor(path); }));
    }
    row.appendChild(tool('Copy', 'Make another like it', function () {
      var copy = JSON.parse(JSON.stringify(nodeAt(path)));
      state.selected = insertAfter(path, copy);
      drawScript();
    }));
    row.appendChild(tool('✕', 'Delete', function () {
      removeAt(path); state.selected = null; drawScript();
    }));
    return row;
  }

  // -------------------------------------------------------------- palette

  function drawCategories() {
    var host = $('cats');
    host.innerHTML = '';
    var groups = (state.catalogue && state.catalogue.categories) || [];
    var all = document.createElement('span');
    all.className = 'chip' + (state.category === '' ? ' on' : '');
    all.textContent = 'All';
    all.addEventListener('click', function () {
      state.category = ''; drawCategories(); drawPalette();
    });
    host.appendChild(all);
    groups.forEach(function (group) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (state.category === group.name ? ' on' : '');
      chip.textContent = group.name;
      chip.addEventListener('click', function () {
        state.category = group.name; drawCategories(); drawPalette();
      });
      host.appendChild(chip);
    });
  }

  function drawPalette() {
    var host = $('palette');
    host.innerHTML = '';
    var groups = (state.catalogue && state.catalogue.categories) || [];
    var needle = state.search.trim().toLowerCase();
    var shown = 0;

    groups.forEach(function (group) {
      if (state.category && group.name !== state.category) return;
      group.blocks.forEach(function (spec) {
        if (needle && (spec.label + ' ' + spec.open + ' ' + spec.cat)
            .toLowerCase().indexOf(needle) < 0) return;
        shown += 1;
        var button = document.createElement('button');
        button.className = 'pick';
        button.innerHTML = escapeHtml(spec.label) +
          '<span class="code">' + escapeHtml(spec.open || '(blank line)') + '</span>';
        button.addEventListener('click', function () { add(spec); });
        host.appendChild(button);
      });
    });

    if (!shown) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'No block matches that.';
      host.appendChild(none);
    }
    $('palcount').textContent = shown + ' to choose from';
  }

  function add(spec) {
    var node = { block: spec.id, values: defaultsFor(spec) };
    if (spec.wrap) node.children = [];

    // Into the selected block when it can hold things, so building a loop is
    // "tap the loop, tap what goes in it" rather than tap-then-indent.
    var target = state.selected ? nodeAt(state.selected) : null;
    var targetSpec = target ? state.byId[target.block] : null;
    if (target && targetSpec && targetSpec.wrap) {
      target.children = target.children || [];
      target.children.push(node);
      state.selected = state.selected.concat([target.children.length - 1]);
    } else {
      state.selected = insertAfter(state.selected, node);
    }
    drawScript();
  }

  // --------------------------------------------------------- the editor

  var editing = null;

  function openEditor(path) {
    var node = nodeAt(path);
    var spec = node && state.byId[node.block];
    if (!spec) return;
    editing = path;
    $('editTitle').textContent = spec.label;
    var host = $('editFields');
    host.innerHTML = '';

    spec.slots.forEach(function (slot) {
      var field = document.createElement('div');
      field.className = 'field';
      var label = document.createElement('label');
      label.textContent = slot.label;
      label.setAttribute('for', 'slot-' + slot.name);
      field.appendChild(label);

      var current = node.values && node.values[slot.name] !== undefined
        ? node.values[slot.name] : slot.default;
      var input;
      if (slot.kind === 'choice') {
        input = document.createElement('select');
        (slot.options || []).forEach(function (option) {
          var item = document.createElement('option');
          item.value = option;
          item.textContent = option;
          if (String(current) === option) item.selected = true;
          input.appendChild(item);
        });
      } else {
        input = document.createElement('input');
        input.type = slot.kind === 'number' ? 'number' : 'text';
        input.value = current === undefined ? '' : current;
        input.autocapitalize = 'none';
        input.autocomplete = 'off';
        input.spellcheck = false;
      }
      input.id = 'slot-' + slot.name;
      input.dataset.slot = slot.name;
      field.appendChild(input);
      host.appendChild(field);
    });

    $('editSheet').classList.add('open');
  }

  function closeEditor(save) {
    if (save && editing) {
      var node = nodeAt(editing);
      if (node) {
        node.values = node.values || {};
        var fields = $('editFields').querySelectorAll('[data-slot]');
        for (var i = 0; i < fields.length; i++) {
          node.values[fields[i].dataset.slot] = fields[i].value;
        }
      }
    }
    editing = null;
    $('editSheet').classList.remove('open');
    drawScript();
  }

  // ----------------------------------------------------- build and save

  function build() {
    return pycmd.call('build', { project: state.project });
  }

  function showCode() {
    build().then(function (result) {
      if (!result || !result.ok) {
        pycmd.toast((result && result.error) || 'That did not build.');
        return;
      }
      $('codeOut').textContent = result.code || '(nothing yet)';
      $('codeTitle').textContent = result.lines + ' line' +
        (result.lines === 1 ? '' : 's') + ' of ' + result.language;
      $('codeProblems').textContent = (result.problems || []).join(' · ');
      $('codeSheet').classList.add('open');
    }).catch(function (error) { pycmd.toast(String(error.message || error)); });
  }

  function openSave() {
    var meta = state.languages.filter(function (row) {
      return row.id === state.project.language;
    })[0];
    var extension = (meta && meta.extension) || '.txt';
    var name = state.project.name || 'untitled';
    $('saveName').value = name.indexOf('.') >= 0 ? name : name + extension;
    $('saveSheet').classList.add('open');
  }

  function doSave() {
    var name = $('saveName').value;
    var folder = $('saveFolder').value;
    $('saveSheet').classList.remove('open');
    pycmd.call('save_file', {
      project: state.project, name: name, folder: folder
    }).then(function (result) {
      if (!result || !result.ok) {
        pycmd.toast((result && result.error) || 'That did not save.');
        return;
      }
      state.project.file = result.path;
      pycmd.toast('Saved ' + result.path);
      storeProject();
    }).catch(function (error) { pycmd.toast(String(error.message || error)); });
  }

  function storeProject() {
    return pycmd.call('save_project', { id: state.id, project: state.project })
      .then(function (result) {
        if (result && result.ok) state.id = result.id;
        return result;
      }).catch(function (error) { pycmd.toast(String(error.message || error)); });
  }

  // ------------------------------------------------------------- drawer

  function openDrawer() {
    pycmd.call('projects', {}).then(function (result) {
      var host = $('drawerList');
      host.innerHTML = '';
      var rows = (result && result.projects) || [];
      if (!rows.length) {
        var none = document.createElement('div');
        none.className = 'empty';
        none.textContent = 'Nothing saved yet. Build something and press Save.';
        host.appendChild(none);
      }
      rows.forEach(function (row) {
        var line = document.createElement('div');
        line.className = 'row';
        line.style.margin = '8px 0';

        var open = document.createElement('button');
        open.className = 'small grow';
        open.style.textAlign = 'left';
        open.innerHTML = escapeHtml(row.name) +
          '<span class="code"> ' + escapeHtml(row.language) + ' · ' +
          row.blocks + ' blocks</span>';
        open.addEventListener('click', function () { loadProject(row.id); });

        var drop = document.createElement('button');
        drop.className = 'small';
        drop.textContent = '✕';
        drop.title = 'Delete ' + row.name;
        drop.addEventListener('click', function () {
          pycmd.call('delete_project', { id: row.id }).then(function () {
            if (state.id === row.id) state.id = '';
            openDrawer();
          });
        });

        line.appendChild(open);
        line.appendChild(drop);
        host.appendChild(line);
      });
      $('drawerSheet').classList.add('open');
    });
  }

  function loadProject(id) {
    pycmd.call('open_project', { id: id }).then(function (result) {
      if (!result || !result.ok) { pycmd.toast('That project is gone.'); return; }
      state.id = result.id;
      state.project = {
        name: result.project.name,
        language: result.project.language,
        blocks: result.project.blocks || [],
        file: result.project.file || ''
      };
      state.selected = null;
      $('name').value = state.project.name;
      $('drawerSheet').classList.remove('open');
      loadCatalogue(state.project.language).then(drawScript);
      drawLanguages();
    });
  }

  // ---------------------------------------------------------- languages

  function drawLanguages() {
    var host = $('langs');
    host.innerHTML = '';
    state.languages.forEach(function (row) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (row.id === state.project.language ? ' on' : '');
      chip.textContent = row.name;
      chip.title = row.about;
      chip.addEventListener('click', function () { switchLanguage(row.id); });
      host.appendChild(chip);
    });
  }

  function switchLanguage(id) {
    if (id === state.project.language) return;
    if (state.project.blocks.length &&
        !confirm('Blocks belong to their language. Switching to ' + id +
                 ' clears the script - is that what you want?')) {
      return;
    }
    state.project.language = id;
    state.project.blocks = [];
    state.selected = null;
    state.category = '';
    drawLanguages();
    loadCatalogue(id).then(drawScript);
  }

  function loadCatalogue(language) {
    return pycmd.call('catalogue', { language: language }).then(function (result) {
      if (!result || !result.ok) {
        pycmd.toast((result && result.error) || 'The blocks did not load.');
        return;
      }
      state.catalogue = (result.groups || [])[0] || { categories: [] };
      state.byId = {};
      (state.catalogue.categories || []).forEach(function (group) {
        group.blocks.forEach(function (spec) { state.byId[spec.id] = spec; });
      });
      drawCategories();
      drawPalette();
    });
  }

  // --------------------------------------------------------------- wiring

  $('name').addEventListener('input', function () {
    state.project.name = $('name').value;
  });
  $('search').addEventListener('input', function () {
    state.search = $('search').value;
    drawPalette();
  });
  $('build').addEventListener('click', showCode);
  $('save').addEventListener('click', openSave);
  $('drawer').addEventListener('click', function () { storeProject().then(openDrawer); });
  $('new').addEventListener('click', function () {
    if (state.project.blocks.length &&
        !confirm('Start a new project? Save the one you have first if you want it.')) {
      return;
    }
    state.id = '';
    state.project = { name: 'untitled', language: state.project.language, blocks: [] };
    state.selected = null;
    $('name').value = state.project.name;
    drawScript();
  });

  $('editOk').addEventListener('click', function () { closeEditor(true); });
  $('editCancel').addEventListener('click', function () { closeEditor(false); });
  $('codeClose').addEventListener('click', function () {
    $('codeSheet').classList.remove('open');
  });
  $('codeSave').addEventListener('click', function () {
    $('codeSheet').classList.remove('open');
    openSave();
  });
  $('saveOk').addEventListener('click', doSave);
  $('saveCancel').addEventListener('click', function () {
    $('saveSheet').classList.remove('open');
  });
  $('drawerClose').addEventListener('click', function () {
    $('drawerSheet').classList.remove('open');
  });

  // ----------------------------------------------------------- first draw

  pycmd.call('languages', {}).then(function (result) {
    state.languages = (result && result.languages) || [];
    // No language asked for, so the plugin's own setting decides.
    return pycmd.call('starter', {});
  }).then(function (result) {
    if (result && result.ok && result.project) {
      state.project = JSON.parse(JSON.stringify(result.project));
      $('name').value = state.project.name;
      $('saveFolder').value = result.folder || '';
    }
    drawLanguages();
    return loadCatalogue(state.project.language);
  }).then(function () {
    drawScript();
  }).catch(function (error) {
    pycmd.toast('Creator could not start: ' + (error.message || error));
  });
})();
</script>
</body>
</html>
